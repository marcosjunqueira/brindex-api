name: Release

# Publishes a release when a SEMVER tag (vX.Y.Z) is pushed: runs the checks, pushes the image to
# GHCR tagged X.Y.Z, X.Y, X and latest, then creates the GitHub Release with generated notes.
# Tag a commit that is already on main:  git tag v1.2.3 && git push origin v1.2.3
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require the tag to be on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      # Also validates the Gradle wrapper checksum.
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew build
      # CodeQL runs through GitHub's default setup on every push to main. Wait for its result on the
      # tagged commit instead of running a second analysis here (default setup rejects uploads from
      # workflow-based CodeQL).
      - name: Require CodeQL to pass on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 1 40); do
            runs=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100" \
              --jq '[.check_runs[] | select(.name | startswith("Analyze ("))]')
            total=$(jq length <<<"$runs")
            pending=$(jq '[.[] | select(.status != "completed")] | length' <<<"$runs")
            failed=$(jq '[.[] | select(.status == "completed" and .conclusion != "success")] | length' <<<"$runs")
            if [ "$failed" -gt 0 ]; then
              echo "::error::CodeQL failed on $GITHUB_SHA"; jq -r '.[] | "\(.name): \(.conclusion)"' <<<"$runs"; exit 1
            fi
            if [ "$total" -gt 0 ] && [ "$pending" -eq 0 ]; then
              jq -r '.[] | "\(.name): \(.conclusion)"' <<<"$runs"; exit 0
            fi
            echo "Waiting for CodeQL ($total found, $pending pending)..."; sleep 15
          done
          echo "::error::No completed CodeQL analysis for $GITHUB_SHA after 10 minutes"; exit 1

  image:
    name: Build and push image
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # v1.2.3 -> 1.2.3, 1.2, 1 and latest. While the major version is 0 the bare major tag
          # ("0") is skipped: 0.x releases make no compatibility promise across minors.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Create GitHub Release
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes \
            --notes "Image: \`${IMAGE}:${TAG#v}\`"
